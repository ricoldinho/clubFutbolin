# Postgres exclusivo para tests de integración y e2e en local.
# No usar para desarrollo ni producción.
#
# Uso:
#   docker compose -f docker-compose.test.yml up -d    # levantar
#   docker compose -f docker-compose.test.yml down     # parar
#
# URL de conexión (usar en .env como DATABASE_URL_TEST):
#   postgresql://test:test@localhost:5433/clubfutbolin_test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: clubfutbolin-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: clubfutbolin_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d clubfutbolin_test"]
      interval: 2s
      timeout: 2s
      retries: 10
