name: CodeQL

on:
  push:
    branches: [main, modules]
  pull_request:
    branches: [main, modules]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Code Scanning availability
        id: code_scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status_code="$(curl -sS -o /tmp/code-scanning-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?per_page=1")"

          if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 300 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "Code scanning no disponible (HTTP ${status_code}). Se omite subida de resultados para evitar fallo falso en CI."

      - name: Skip reason
        if: steps.code_scanning.outputs.enabled != 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
        run: |
          echo "CodeQL omitido por permisos o configuracion del repositorio."
          echo "- code_scanning_enabled: ${{ steps.code_scanning.outputs.enabled }}"
          echo "- event_name: ${{ github.event_name }}"
          echo "- is_fork_pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}"

      - name: Initialize CodeQL
        if: steps.code_scanning.outputs.enabled == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Setup Node.js
        if: steps.code_scanning.outputs.enabled == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        if: steps.code_scanning.outputs.enabled == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        run: npm ci

      - name: Build
        if: steps.code_scanning.outputs.enabled == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        run: npm run build

      - name: Perform CodeQL Analysis
        if: steps.code_scanning.outputs.enabled == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/analyze@v3
