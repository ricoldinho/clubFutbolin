name: CI

on:
  push:
    branches: [main, modules]
  pull_request:
    branches: [main, modules]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clubfutbolin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/clubfutbolin_test
      DATABASE_URL_TEST: postgresql://test:test@localhost:5432/clubfutbolin_test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Generate Prisma Client
        run: npm run db:generate -w @clubfutbolin/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build API
        run: npm run build -w @clubfutbolin/api

      - name: Build web
        run: npm run build -w @clubfutbolin/web

      - name: Unit tests (API)
        run: npm run test:coverage

      - name: Unit tests (web)
        run: npm run test:run -w @clubfutbolin/web

      - name: Apply Prisma migrations
        run: npm run db:migrate -w @clubfutbolin/api

      - name: Integration tests
        run: npm run test:integration
