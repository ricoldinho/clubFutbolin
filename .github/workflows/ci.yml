name: CI

on:
  push:
    branches: [main, modules]
  pull_request:
    branches: [main, modules]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clubfutbolin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/clubfutbolin_test
      DATABASE_URL_TEST: postgresql://test:test@localhost:5432/clubfutbolin_test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (PR)
        if: github.event_name == 'pull_request'
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit dependencies (main/modules blocking)
        if: github.event_name != 'pull_request'
        run: npm audit --audit-level=high

      - name: Generate Prisma Client
        run: npm run db:generate -w @clubfutbolin/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build API
        run: npm run build -w @clubfutbolin/api

      - name: Build web
        run: npm run build -w @clubfutbolin/web

      - name: Unit tests (API)
        run: npm run test:coverage

      - name: Unit tests + coverage (web)
        run: npm run test:coverage:web

      - name: Apply Prisma migrations
        run: npm run db:migrate -w @clubfutbolin/api

      - name: Integration tests
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build-and-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clubfutbolin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/clubfutbolin_test
      DATABASE_URL_TEST: postgresql://test:test@localhost:5432/clubfutbolin_test
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_API_BASE_URL: http://127.0.0.1:3000
      VITE_API_BASE: http://127.0.0.1:3000
      E2E_ADMIN_EMAIL: admin@seed.local
      E2E_ADMIN_PASSWORD: admin123456
      PRISMA_SEED_ADMIN_PASSWORD: admin123456
      PRISMA_SEED_USER_PASSWORD: user123456
      JWT_SECRET: ci-e2e-jwt-secret-please-change-1234567890
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 14d

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Build API and web
        run: npm run build

      - name: Apply Prisma migrations
        run: npm run db:migrate -w @clubfutbolin/api

      - name: Seed database for E2E
        run: npm run db:seed -w @clubfutbolin/api

      - name: Start API and web preview
        run: |
          npm run start -w @clubfutbolin/api > api.log 2>&1 &
          npm run preview -w @clubfutbolin/web -- --host 127.0.0.1 --port 4173 > web.log 2>&1 &

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not start in time"
          cat api.log
          exit 1

      - name: Wait for web
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Web did not start in time"
          cat web.log
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
